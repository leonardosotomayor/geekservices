[build]
  base = "."
  publish = "geek-services-site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.geekservicesny.com/*"
  to = "https://geekservicesny.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://geekservicesny.netlify.app/*"
  to = "https://geekservicesny.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/founder.html"
  to = "/founder/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
